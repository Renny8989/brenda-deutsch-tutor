name: Deutsch Tutor

on:
  schedule:
    # Orari in UTC, calcolati per l'ora legale tedesca (CEST, UTC+2).
    # Minuti scostati dai quarti d'ora "tondi" per evitare i picchi di carico
    # di GitHub Actions (GitHub sconsiglia esplicitamente *:00, *:15, *:30, *:45).
    # Cambieranno di un'ora reale quando la Germania torna all'ora solare (CET, fine ottobre).
    - cron: "43 7 * * *"   # ~09:43 CEST -> lezione del mattino
    - cron: "38 10 * * *"  # TEST TEMPORANEO: ~12:38 CEST, poi tornerà a 28
    - cron: "13 16 * * *"  # ~18:13 CEST -> lezione della sera
  workflow_dispatch:
    inputs:
      lesson:
        description: "Lezione da inviare"
        required: true
        default: "morning"
        type: choice
        options:
          - morning
          - midday
          - evening

jobs:
  send-lesson:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Determine which lesson to send
        id: lesson
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "type=${{ github.event.inputs.lesson }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.schedule }}" = "43 7 * * *" ]; then
            echo "type=morning" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.schedule }}" = "38 10 * * *" ]; then
            echo "type=midday" >> "$GITHUB_OUTPUT"
          else
            echo "type=evening" >> "$GITHUB_OUTPUT"
          fi

      - name: Send lesson
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python send_lesson.py ${{ steps.lesson.outputs.type }}
